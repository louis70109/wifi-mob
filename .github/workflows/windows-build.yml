name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained Windows executable
        run: >
          dotnet publish windows/WiFiCat.Windows/WiFiCat.Windows.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output artifacts/wifi-mob-win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: wifi-mob-win-x64
          path: artifacts/wifi-mob-win-x64/wifi-mob.exe
          if-no-files-found: error
          retention-days: 14
