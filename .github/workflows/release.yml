name: Release

on:
  push:
    tags: ['v*']

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Extract and validate version
        id: v
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_REF -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw 'tag must use vMAJOR.MINOR.PATCH'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Publish self-contained Windows executable
        run: >
          dotnet publish windows/WiFiCat.Windows/WiFiCat.Windows.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:Version=${{ steps.v.outputs.version }}
          -p:AssemblyVersion=${{ steps.v.outputs.version }}.0
          -p:FileVersion=${{ steps.v.outputs.version }}.0
          --output artifacts/wifi-mob-win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: wifi-mob-windows-release
          path: artifacts/wifi-mob-win-x64/wifi-mob.exe
          if-no-files-found: error
          retention-days: 1
  build:
    needs: build-windows
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract and validate version
        id: v
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          version="${RELEASE_REF#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Update package version
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          sed -i.bak "s/^VERSION=.*/VERSION=\"$VERSION\"/" scripts/package.sh
          rm -f scripts/package.sh.bak

      - name: Test
        run: swift test

      - name: Build release
        run: swift build -c release

      - name: Package
        run: bash scripts/package.sh
      - name: Download Windows release executable
        uses: actions/download-artifact@v4
        with:
          name: wifi-mob-windows-release
          path: dist/windows

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          TAG="v$VERSION"
          PREV_TAG=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "")
          NOTES_FILE=$(mktemp)
          {
            echo "## 更新內容"
            echo ""
            if [[ -n "$PREV_TAG" ]]; then
              git log "$PREV_TAG..$TAG" --pretty=format:"- %s" --no-merges | grep -v "^- release: v" || true
              echo ""
              echo ""
              echo "**Full changelog:** $PREV_TAG...$TAG"
            else
              git log "$TAG" --pretty=format:"- %s" --no-merges | grep -v "^- release: v" || true
            fi
            echo ""
            echo ""
            echo "## 安裝"
            echo ""
            echo "解壓 zip → 雙擊 \`安裝.command\` 自動安裝，或手動："
            echo ""
            echo "1. 拖 \`wifi-mob.app\` 進 \`/Applications/\`"
            echo "2. Terminal 執行："
            echo '   ```sh'
            echo "   xattr -dr com.apple.quarantine \"/Applications/wifi-mob.app\""
            echo '   ```'
            echo ""
            echo "Windows x64：下載 \`wifi-mob.exe\`，直接執行（自包含，無需另外安裝 .NET）。"
          } > "$NOTES_FILE"

          gh release create "$TAG" \
            --title "wifi-mob $VERSION" \
            --notes-file "$NOTES_FILE" \
            "dist/wifi-mob-$VERSION.zip" \
            "dist/windows/wifi-mob.exe"
          rm -f "$NOTES_FILE"
